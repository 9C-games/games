
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turbo Racer 2D</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101827;
 color:white;
 text-align:center;
 font-family:Arial;
}
h1,h2{color:#ffcc00}
button{
 border:0;
 padding:12px 17px;
 margin:5px;
 border-radius:10px;
 background:#ffcc00;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.5;cursor:not-allowed}
#game{
 width:min(95vw,420px);
 height:auto;
 border:4px solid white;
 border-radius:12px;
 background:#333;
 display:block;
 margin:10px auto;
}
.stats{font-size:19px;line-height:1.8}
.menu{
 max-width:440px;
 margin:12px auto;
 padding:15px;
 background:#1d2b40;
 border-radius:15px;
}
#garage{display:none}
.car-option{
 display:inline-block;
 width:125px;
 padding:12px 5px;
 margin:6px;
 background:#293c55;
 border-radius:12px;
}
.swatch{
 width:45px;height:45px;
 border-radius:50%;
 margin:5px auto;
 border:3px solid white;
}
.selected{outline:3px solid #ffcc00}
#status{color:#ffcc00;min-height:25px}
</style>
</head>
<body>

<h1>🏎️ TURBO RACER 2D</h1>

<div class="stats">
🪙 Münzen: <span id="coins">0</span>
</div>

<div class="menu">
<button onclick="showGarage()">🎨 GARAGE</button>
<button onclick="showGame()">🏁 RENNEN</button>
</div>

<div id="garage" class="menu">
<h2>🚗 DEINE GARAGE</h2>
<p>Wähle dein Lieblingsauto!</p>
<div id="cars"></div>
<p id="status"></p>
<button onclick="showGame()">ZURÜCK ZUM RENNEN</button>
</div>

<div id="race">
<div class="stats">
⭐ Punkte: <span id="score">0</span><br>
🏆 Rekord: <span id="best">0</span><br>
❤️ Leben: <span id="lives">3</span><br>
🪙 Gesammelt: <span id="collected">0</span>
</div>

<canvas id="game" width="420" height="650"></canvas>

<button id="left">⬅️</button>
<button id="right">➡️</button>
<br>
<button onclick="start()">START / NEUSTART</button>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

const cars=[
 {name:"Rot",color:"#ff3030",price:0},
 {name:"Blau",color:"#3498ff",price:50},
 {name:"Grün",color:"#20cc70",price:100},
 {name:"Gelb",color:"#ffcc00",price:150},
 {name:"Lila",color:"#aa55ff",price:200},
 {name:"Pink",color:"#ff69b4",price:300},
 {name:"Schwarz",color:"#222222",price:400},
 {name:"Weiß",color:"#ffffff",price:500}
];

let saved;
try{
 saved=JSON.parse(localStorage.getItem("turboSave")||"{}");
}catch(e){saved={};}

let money=Number(saved.money)||0;
let best=Number(saved.best)||0;
let unlocked=Array.isArray(saved.unlocked)?saved.unlocked:[0];
unlocked=unlocked.filter(i=>Number.isInteger(i)&&i>=0&&i<cars.length);
if(!unlocked.includes(0))unlocked.unshift(0);

let selected=unlocked.includes(saved.selected)?saved.selected:0;

let player={x:185,y:520};
let enemies=[],coins=[],keys={};
let score=0,lives=3,speed=6;
let offset=0,playing=false;
let spawnTimer=0,coinTimer=0,frame=0;
let invincible=0;

function save(){
 try{localStorage.setItem("turboSave",JSON.stringify({money,best,unlocked,selected}))}catch(e){}
 document.getElementById("coins").textContent=money;
}
document.getElementById("best").textContent=best;

function showGarage(){
 playing=false;
 document.getElementById("race").style.display="none";
 document.getElementById("garage").style.display="block";
 renderGarage();
}

function showGame(){
 document.getElementById("garage").style.display="none";
 document.getElementById("race").style.display="block";
}

function renderGarage(){
 let html="";
 cars.forEach((car,i)=>{
  let owned=unlocked.includes(i);
  let active=selected===i;
  html+=`
  <div class="car-option ${active?'selected':''}">
   <div class="swatch" style="background:${car.color}"></div>
   <b>${car.name}</b><br>
   ${active?"<p>Ausgewählt ✓</p>":
   owned?
   `<button onclick="selectCar(${i})">AUSWÄHLEN</button>`:
   `<p>🪙 ${car.price}</p>
   <button ${money<car.price?'disabled':''}
   onclick="buyCar(${i})">KAUFEN</button>`}
  </div>`;
 });
 document.getElementById("cars").innerHTML=html;
}

function buyCar(i){
 if(unlocked.includes(i))return;
 if(money<cars[i].price)return;
 money-=cars[i].price;
 unlocked.push(i);
 selected=i;
 save();
 renderGarage();
 document.getElementById("status").textContent=
 "🎉 "+cars[i].name+" freigeschaltet!";
}

function selectCar(i){
 if(!unlocked.includes(i))return;
 selected=i;
 save();
 renderGarage();
 document.getElementById("status").textContent=
 cars[i].name+" ausgewählt!";
}

function car(x,y,color){
 ctx.fillStyle=color;
 ctx.fillRect(x+5,y,38,85);
 ctx.fillStyle="#111";
 ctx.fillRect(x,y+12,7,23);
 ctx.fillRect(x+41,y+12,7,23);
 ctx.fillRect(x,y+55,7,23);
 ctx.fillRect(x+41,y+55,7,23);
 ctx.fillStyle="#aeeaff";
 ctx.fillRect(x+11,y+12,26,20);
 ctx.fillStyle="#222";
 ctx.fillRect(x+11,y+54,26,20);
 ctx.fillStyle="#fff";
 ctx.fillRect(x+9,y+3,9,5);
 ctx.fillRect(x+32,y+3,9,5);
}

function road(){
 ctx.fillStyle="#247b35";
 ctx.fillRect(0,0,420,650);
 ctx.fillStyle="#444";
 ctx.fillRect(45,0,330,650);
 ctx.fillStyle="white";
 ctx.fillRect(55,0,5,650);
 ctx.fillRect(360,0,5,650);
 for(let y=-100;y<700;y+=100){
  ctx.fillRect(207,y+offset,7,50);
 }
 offset=(offset+speed)%100;
}

// Gegner erscheinen an zufälligen Stellen
// statt nur auf drei festen Fahrspuren.
function spawnEnemy(){
 let x;
 let attempts=0;

 do{
  x=62+Math.random()*248;
  attempts++;
 }while(
  attempts<20 &&
  enemies.some(e=>
   Math.abs(e.x-x)<55 && e.y<100
  )
 );

 enemies.push({
  x:x,
  y:-100,
  color:["#3498ff","#ffdd33","#aa55ff","#eeeeee"][
   Math.floor(Math.random()*4)
  ]
 });
}

function spawnCoin(){
 let x=62+Math.random()*248;
 coins.push({
  x:x,
  y:-30
 });
}

function hit(a,b){
 return a.x+8<b.x+40 &&
 a.x+40>b.x+8 &&
 a.y+8<b.y+77 &&
 a.y+77>b.y+8;
}

function drawCoin(x,y){
 ctx.beginPath();
 ctx.arc(x,y,13,0,Math.PI*2);
 ctx.fillStyle="#ffcc00";
 ctx.fill();
 ctx.lineWidth=4;
 ctx.strokeStyle="#ff9900";
 ctx.stroke();
 ctx.fillStyle="#fff2a0";
 ctx.font="bold 16px Arial";
 ctx.textAlign="center";
 ctx.fillText("$",x,y+6);
}

function endGame(){
 playing=false;
 best=Math.max(best,score);
 save();
 document.getElementById("best").textContent=best;
 ctx.fillStyle="rgba(0,0,0,.85)";
 ctx.fillRect(0,0,420,650);
 ctx.fillStyle="#ffcc00";
 ctx.textAlign="center";
 ctx.font="bold 42px Arial";
 ctx.fillText("GAME OVER",210,270);
 ctx.font="24px Arial";
 ctx.fillStyle="white";
 ctx.fillText("Punkte: "+score,210,325);
 ctx.fillText("Münzen: "+money,210,365);
 ctx.fillText("Rekord: "+best,210,405);
 ctx.font="18px Arial";
 ctx.fillText("Drücke START zum Neustart",210,445);
}

function loop(){
 if(!playing)return;
 frame++;
 road();

 speed=6+Math.min(10,score/250);

 if(keys.ArrowLeft||keys.a||keys.A)player.x-=6;
 if(keys.ArrowRight||keys.d||keys.D)player.x+=6;

 // Auto darf nicht ins Gras fahren
 player.x=Math.max(62,Math.min(310,player.x));

 spawnTimer++;
 if(spawnTimer>Math.max(22,65-score/30)){
  spawnEnemy();

  if(score>300&&Math.random()<0.4)
   spawnEnemy();

  spawnTimer=0;
 }

 coinTimer++;
 if(coinTimer>85){
  spawnCoin();
  coinTimer=0;
 }

 enemies.forEach(e=>{
  e.y+=speed;
  car(e.x,e.y,e.color);

  if(invincible<=0&&hit(player,e)){
   lives--;
   invincible=75;
   document.getElementById("lives").textContent=lives;
   e.y=800;
   if(lives<=0){
    endGame();
    return;
   }
  }
 });

 coins.forEach(coin=>{
  coin.y+=speed;
  drawCoin(coin.x,coin.y);

  if(Math.abs(player.x+24-coin.x)<32&&
     Math.abs(player.y+42-coin.y)<48){
   money++;
   document.getElementById("collected").textContent=
    Number(document.getElementById("collected").textContent)+1;
   save();
   coin.y=800;
  }
 });

 if(!playing)return;

 enemies=enemies.filter(e=>e.y<700);
 coins=coins.filter(e=>e.y<700);

 if(invincible>0)invincible--;

 if(invincible===0||frame%8<4){
  car(player.x,player.y,cars[selected].color);
 }

 score++;
 document.getElementById("score").textContent=score;
 requestAnimationFrame(loop);
}

function start(){
 showGame();
 player.x=185;
 enemies=[];
 coins=[];
 score=0;
 lives=3;
 speed=6;
 offset=0;
 frame=0;
 invincible=0;
 spawnTimer=0;
 coinTimer=0;
 document.getElementById("score").textContent=0;
 document.getElementById("lives").textContent=3;
 document.getElementById("collected").textContent=0;
 playing=true;
 loop();
}

document.addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(["ArrowLeft","ArrowRight"," "].includes(e.key))
 e.preventDefault();
});

document.addEventListener("keyup",e=>keys[e.key]=false);

function hold(id,key){
 let b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>{
  b.addEventListener(ev,()=>keys[key]=false);
 });
}

hold("left","ArrowLeft");
hold("right","ArrowRight");

save();
renderGarage();
road();
car(player.x,player.y,cars[selected].color);
ctx.fillStyle="white";
ctx.textAlign="center";
ctx.font="24px Arial";
ctx.fillText("Drücke START!",210,300);
</script>
</body>
</html>
