
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cube Jump 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10182c;color:white;font-family:Arial;text-align:center}
h1{color:#54c9ff;margin:12px}
#info{margin:10px;font-size:16px}
canvas{width:96vw;max-width:950px;border:4px solid white;border-radius:12px;display:block;margin:auto;touch-action:none}
.controls{display:flex;justify-content:center;gap:14px;margin:12px}
button{padding:14px 22px;border:0;border-radius:12px;background:#268bd2;color:white;font-size:19px;font-weight:bold}
#message{height:26px;color:#ffdc3b;font-weight:bold}
</style>
</head>
<body>
<h1>🟦 CUBE JUMP 2.0</h1>
<div id="info"></div>
<canvas id="game" width="900" height="450"></canvas>
<div class="controls">
<button id="left">⬅️</button>
<button id="jump">⬆️ SPRINGEN</button>
<button id="right">➡️</button>
</div>
<div id="message">Erkunde die fünf verschiedenen Welten!</div>
<button onclick="restart()">🔄 Neustart</button>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
const W=900,H=450;

const worlds=[
{name:"🌳 Wald",bg:"#83dafa",ground:"#369b43",length:3000},
{name:"🌋 Lavawelt",bg:"#542b30",ground:"#713323",length:3300},
{name:"❄️ Eiswelt",bg:"#b8eaff",ground:"#65bce0",length:3600},
{name:"🏜️ Wüste",bg:"#f3d18a",ground:"#c3923b",length:3900},
{name:"👻 Geisterschloss",bg:"#342842",ground:"#292039",length:4200}
];

const CUBE_SAVE_KEY="cubeJumpProgress";
let cubeProgress={};
try{cubeProgress=JSON.parse(localStorage.getItem(CUBE_SAVE_KEY)||"{}")}catch(e){}
let bestScore=Number(cubeProgress.bestScore)||0,totalCoins=Number(cubeProgress.totalCoins)||0;
let level=0,score=0,camera=0;
let player,platforms,hazards,coins,enemies,checkpoints,goal;
let left=false,right=false,dead=false,won=false;
let checkpoint=0,lastTime=0;

function addPlatform(x,y,w,type="normal"){
platforms.push({
x,y,w,h:14,type,
originX:x,originY:y,
timer:0,broken:false
});
}
function addGround(x,w){
platforms.push({
x,y:390,w,h:100,type:"ground",
originX:x,originY:390,timer:0,broken:false
});
}
function addHazard(x,y,w,h,type){
hazards.push({x,y,w,h,type,originX:x});
}
function addCoin(x,y){
coins.push({x,y,taken:false});
}
function addEnemy(x,min,max,speed=1.3){
enemies.push({x,y:358,w:30,h:32,min,max,dir:1,speed});
}

function buildLevel(){
let L=worlds[level].length;
platforms=[];hazards=[];coins=[];enemies=[];
checkpoints=[0];

addGround(0,250);

let x=250;
let i=0;

while(x<L-300){
let width=220+(i%3)*15;
let end=x+width;
let p=i%6;

// Jede Welt besitzt ihre eigenen Hindernis-Muster.
if(level===0){
// WALD: Baumstämme, Äste und Baumhäuser
addGround(x,width);
if(p===0){
addHazard(x+110,365,28,25,"spike");
addPlatform(x+45,320,80);
addCoin(x+85,285);
}
if(p===1){
addPlatform(x+25,315,85);
addPlatform(x+130,255,85);
addPlatform(x+180,320,65);
addCoin(x+170,215);
}
if(p===2){
addEnemy(x+85,x+20,x+190,1.3);
addPlatform(x+110,285,65);
}
if(p===3){
addPlatform(x+25,325,70,"moving");
addPlatform(x+135,280,75);
addCoin(x+165,245);
}
if(p===4){
addHazard(x+80,365,30,25,"spike");
addHazard(x+155,365,30,25,"spike");
addPlatform(x+95,305,90);
}
if(p===5){
addPlatform(x+35,315,75,"crumble");
addPlatform(x+125,275,75,"crumble");
addPlatform(x+195,315,60);
}
}
else if(level===1){
// LAVA: Lavagruben und Feuer
addGround(x,width);
if(p===0){
addHazard(x+65,355,45,35,"fire");
addHazard(x+145,355,45,35,"fire");
}
if(p===1){
addPlatform(x+15,330,65,"moving");
addPlatform(x+110,280,65,"moving");
addPlatform(x+200,330,65,"moving");
addHazard(x+85,380,110,20,"lava");
}
if(p===2){
addHazard(x+95,340,35,50,"fire");
addHazard(x+165,340,35,50,"fire");
addPlatform(x+100,280,90);
}
if(p===3){
addPlatform(x+20,315,65,"crumble");
addPlatform(x+105,270,65,"crumble");
addPlatform(x+190,315,65,"crumble");
addHazard(x+65,380,100,20,"lava");
}
if(p===4){
addEnemy(x+90,x+20,x+195,2.1);
addPlatform(x+70,300,100);
}
if(p===5){
addPlatform(x+20,310,75,"moving");
addHazard(x+115,355,40,35,"fire");
addPlatform(x+155,270,75);
}
}
else if(level===2){
// EIS: Eiszapfen, Schneehügel und rutschige Wege
addGround(x,width);
if(p===0){
addHazard(x+65,320,22,65,"icicle");
addHazard(x+145,320,22,65,"icicle");
addCoin(x+110,290);
}
if(p===1){
addPlatform(x+20,320,75,"moving");
addPlatform(x+120,275,75,"moving");
addPlatform(x+205,320,60);
}
if(p===2){
addHazard(x+80,365,35,25,"ice");
addHazard(x+155,365,35,25,"ice");
addPlatform(x+105,305,75);
}
if(p===3){
addPlatform(x+25,315,70,"crumble");
addPlatform(x+115,255,70,"crumble");
addPlatform(x+200,315,60);
}
if(p===4){
addEnemy(x+100,x+15,x+200,2);
addHazard(x+165,320,20,65,"icicle");
}
if(p===5){
addPlatform(x+10,330,65);
addPlatform(x+100,285,65,"moving");
addPlatform(x+190,245,65,"moving");
}
}
else if(level===3){
// WÜSTE: Kakteen, Treibsand und fallende Felsen
addGround(x,width);
if(p===0){
addHazard(x+70,350,30,40,"cactus");
addHazard(x+160,350,30,40,"cactus");
}
if(p===1){
addHazard(x+45,380,145,18,"sand");
addPlatform(x+45,315,65);
addPlatform(x+140,280,65);
}
if(p===2){
addPlatform(x+20,310,65,"moving");
addPlatform(x+115,255,65,"moving");
addHazard(x+175,350,30,40,"cactus");
}
if(p===3){
addHazard(x+65,350,25,40,"cactus");
addHazard(x+150,350,25,40,"cactus");
addPlatform(x+90,285,90,"crumble");
}
if(p===4){
addEnemy(x+100,x+15,x+200,2.5);
addHazard(x+170,380,35,18,"sand");
}
if(p===5){
addPlatform(x+20,320,65,"crumble");
addPlatform(x+105,265,65,"crumble");
addPlatform(x+190,310,65,"moving");
}
}
else{
// GEISTERSCHLOSS: Fallen, Geister und schwierige Sprünge
addGround(x,width);
if(p===0){
addHazard(x+60,350,30,40,"ghost");
addHazard(x+160,350,30,40,"spike");
}
if(p===1){
addPlatform(x+20,315,65,"moving");
addPlatform(x+105,250,65,"moving");
addPlatform(x+190,315,65,"moving");
}
if(p===2){
addEnemy(x+80,x+10,x+200,2.8);
addPlatform(x+110,280,75,"crumble");
}
if(p===3){
addHazard(x+50,350,30,40,"ghost");
addHazard(x+140,350,30,40,"ghost");
addPlatform(x+90,285,90);
}
if(p===4){
addPlatform(x+20,320,60,"crumble");
addPlatform(x+95,265,60,"crumble");
addPlatform(x+170,210,60,"crumble");
}
if(p===5){
addHazard(x+55,350,30,40,"spike");
addHazard(x+140,350,30,40,"spike");
addEnemy(x+185,x+100,x+205,3);
}
}

// Münzen in jedem Abschnitt
for(let j=0;j<3;j++){
addCoin(x+35+j*55,230-(j%2)*30);
}

if(i%3===2){
checkpoints.push(end+30);
}

x=end+85;
i++;
}

// Schlussstrecke
addGround(L-300,300);
goal=L-90;

if(level===4){
// Bossarena
addEnemy(L-390,L-500,L-300,2.5);
enemies[enemies.length-1].boss=true;
enemies[enemies.length-1].hp=5;
enemies[enemies.length-1].y=335;
enemies[enemies.length-1].h=55;
}

checkpoint=0;
player={x:45,y:340,w:30,h:30,vx:0,vy:0,on:false};
camera=0;
dead=false;
won=false;
updateInfo();
}

function updateInfo(){
document.getElementById("info").textContent=
`Welt ${level+1}/5 | ${worlds[level].name} | 🪙 ${score} | Gesamt: ${totalCoins} | Rekord: ${bestScore} | Schwierigkeit: ${"★".repeat(level+1)}`;
}

function saveProgress(){
try{localStorage.setItem(CUBE_SAVE_KEY,JSON.stringify({bestScore,totalCoins}))}catch(e){}
}

function restart(){
level=0;score=0;buildLevel();
document.getElementById("message").textContent="Auf ins Abenteuer!";
}

function jump(){
if(player.on&&!dead&&!won){
player.vy=-12;
player.on=false;
}
}

function bind(id,dir){
let el=document.getElementById(id);
el.addEventListener("pointerdown",e=>{
e.preventDefault();
if(dir==="jump")jump();
else if(dir==="left")left=true;
else right=true;
});
el.addEventListener("pointerup",()=>{
if(dir==="left")left=false;
if(dir==="right")right=false;
});
el.addEventListener("pointerleave",()=>{
if(dir==="left")left=false;
if(dir==="right")right=false;
});
}
bind("left","left");
bind("right","right");
bind("jump","jump");
window.addEventListener("pointerup",()=>{left=false;right=false});

document.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft"||e.key==="a")left=true;
if(e.key==="ArrowRight"||e.key==="d")right=true;
if(e.key===" "||e.key==="ArrowUp"||e.key==="w"){
e.preventDefault();jump();
}
});
document.addEventListener("keyup",e=>{
if(e.key==="ArrowLeft"||e.key==="a")left=false;
if(e.key==="ArrowRight"||e.key==="d")right=false;
});

function hit(a,b){
return a.x<b.x+b.w&&a.x+a.w>b.x&&
a.y<b.y+b.h&&a.y+a.h>b.y;
}

// WICHTIG: Alle zerbrechlichen Blöcke werden beim Respawn repariert.
function resetTemporaryPlatforms(){
for(let p of platforms){
if(p.type==="crumble"){
p.timer=0;
p.broken=false;
}
}
}

function respawn(){
resetTemporaryPlatforms();
player.x=checkpoint+8;
player.y=320;
player.vx=0;
player.vy=0;
player.on=false;
dead=false;
document.getElementById("message").textContent=
"🚩 Respawn! Zerbrechliche Blöcke wurden repariert.";
}

function update(dt){
if(dead||won)return;

let speed=4.2+level*.2;
player.vx=(right?speed:0)-(left?speed:0);
player.x=Math.max(0,player.x+player.vx*dt);

let oldY=player.y;
player.vy=Math.min(player.vy+.55*dt,14);
player.y+=player.vy*dt;
player.on=false;

// Bewegliche und zerbrechliche Plattformen
for(let p of platforms){
if(p.type==="moving"){
p.x=p.originX+Math.sin(Date.now()/450+p.originX)*38;
p.y=p.originY+Math.sin(Date.now()/650+p.originX)*13;
}

if(p.type==="crumble"&&p.timer>0){
p.timer+=dt;
if(p.timer>65)p.broken=true;
}
if(p.broken)continue;

if(player.x+player.w>p.x&&player.x<p.x+p.w&&
oldY+player.h<=p.y+7&&player.y+player.h>=p.y&&player.vy>=0){
player.y=p.y-player.h;
player.vy=0;
player.on=true;
if(p.type==="crumble"&&p.timer===0)p.timer=1;
}
}

// Gegner
for(let e of [...enemies]){
e.x+=e.dir*e.speed*dt;
if(e.x<e.min||e.x>e.max)e.dir*=-1;

if(hit(player,e)){
if(player.vy>1&&oldY+player.h<=e.y+15){
player.vy=-9;
if(e.boss){
e.hp--;
document.getElementById("message").textContent=
"👑 Boss getroffen! Noch "+e.hp+" Treffer!";
if(e.hp<=0){
enemies=enemies.filter(a=>a!==e);
document.getElementById("message").textContent="🏆 Endboss besiegt!";
}
}else{
enemies=enemies.filter(a=>a!==e);
}
}else{
respawn();
break;
}
}
}

// Gefahren
for(let h of hazards){
if(hit(player,h)){
respawn();
break;
}
}
if(player.y>520)respawn();

// Münzen
for(let o of coins){
if(!o.taken&&hit(player,{x:o.x-10,y:o.y-10,w:20,h:20})){
o.taken=true;
score++;
totalCoins++;
bestScore=Math.max(bestScore,score);
saveProgress();
updateInfo();
}
}

// Checkpoints
for(let cp of checkpoints){
if(cp>checkpoint&&player.x>=cp){
checkpoint=cp;
document.getElementById("message").textContent="🚩 Checkpoint gespeichert!";
}
}

// Ziel
if(player.x+player.w>=goal){
if(level===4){
if(enemies.some(e=>e.boss)) {
player.x=goal-40;
} else {
won=true;
document.getElementById("message").textContent="🏆 ALLE WELTEN GESCHAFFT!";
}
}else{
level++;
buildLevel();
document.getElementById("message").textContent="🎉 Neue Welt freigeschaltet!";
}
}

camera=Math.max(0,Math.min(player.x-300,worlds[level].length-W));
}

// Hintergrund und Dekoration
function background(){
let w=worlds[level];
ctx.fillStyle=w.bg;
ctx.fillRect(0,0,W,H);

for(let i=0;i<12;i++){
let x=((i*180-camera*.2)%1100+1100)%1100;
if(level===0){
// Bäume
ctx.fillStyle="#287844";
ctx.fillRect(x-5,270,12,120);
ctx.fillStyle="#1d8e45";
ctx.beginPath();ctx.arc(x,260,35,0,7);ctx.fill();
}else if(level===1){
// Lava-Berge
ctx.fillStyle="#b84224";
ctx.beginPath();ctx.moveTo(x-40,390);ctx.lineTo(x,220);ctx.lineTo(x+50,390);ctx.fill();
}else if(level===2){
// Eiskristalle
ctx.fillStyle="#ffffff88";
ctx.beginPath();ctx.moveTo(x,120);ctx.lineTo(x-25,190);ctx.lineTo(x+25,190);ctx.fill();
}else if(level===3){
// Pyramiden
ctx.fillStyle="#d3a04c";
ctx.beginPath();ctx.moveTo(x-45,390);ctx.lineTo(x,265);ctx.lineTo(x+45,390);ctx.fill();
}else{
// Schloss-Türme
ctx.fillStyle="#30243e";
ctx.fillRect(x-20,180,40,210);
ctx.beginPath();ctx.moveTo(x-20,180);ctx.lineTo(x,125);ctx.lineTo(x+20,180);ctx.fill();
}
}
}

function draw(){
background();
let w=worlds[level];

// Plattformen
for(let p of platforms){
let x=p.x-camera;
if(x<-100||x>W+100||p.broken)continue;
ctx.fillStyle=p.type==="moving"?"#bcefff":
p.type==="crumble"?"#b78b60":w.ground;
ctx.fillRect(x,p.y,p.w,p.h);
ctx.fillStyle="#ffffff44";
ctx.fillRect(x,p.y,p.w,4);

if(p.type==="crumble"){
ctx.strokeStyle="#49352b";
ctx.beginPath();ctx.moveTo(x+15,p.y);ctx.lineTo(x+30,p.y+13);
ctx.moveTo(x+45,p.y);ctx.lineTo(x+55,p.y+10);ctx.stroke();
}
}

// Gefahren
for(let h of hazards){
let x=h.x-camera;
if(h.type==="spike"){
ctx.fillStyle="#e52e3e";
ctx.beginPath();ctx.moveTo(x,h.y+h.h);
ctx.lineTo(x+h.w/2,h.y);ctx.lineTo(x+h.w,h.y+h.h);ctx.fill();
}else if(h.type==="fire"){
ctx.fillStyle="#ff4a10";
ctx.beginPath();ctx.arc(x+18,h.y+22,18+Math.sin(Date.now()/90)*4,0,7);ctx.fill();
}else if(h.type==="lava"){
ctx.fillStyle="#ff3d10";
ctx.fillRect(x,h.y,h.w,h.h);
ctx.fillStyle="#ffc331";
ctx.fillRect(x,h.y,h.w,5);
}else if(h.type==="icicle"){
ctx.fillStyle="#e4ffff";
ctx.beginPath();ctx.moveTo(x,h.y);ctx.lineTo(x+h.w/2,h.y+h.h);
ctx.lineTo(x+h.w,h.y);ctx.fill();
}else if(h.type==="ice"){
ctx.fillStyle="#3deaff";ctx.fillRect(x,h.y,h.w,h.h);
}else if(h.type==="sand"){
ctx.fillStyle="#a66b18";ctx.fillRect(x,h.y,h.w,h.h);
}else if(h.type==="cactus"){
ctx.fillStyle="#287c39";
ctx.fillRect(x+9,h.y,13,h.h);
ctx.fillRect(x,h.y+12,10,8);
ctx.fillRect(x+19,h.y+18,10,8);
}else{
ctx.fillStyle="#b6a2dc";
ctx.beginPath();ctx.arc(x+15,h.y+18,17,0,7);ctx.fill();
}
}

// Gegner
for(let e of enemies){
let x=e.x-camera;
ctx.fillStyle=e.boss?"#8b36bd":
level===0?"#87502c":level===2?"#65bde5":"#b32e49";
ctx.fillRect(x,e.y,e.w,e.h);
ctx.fillStyle="white";
ctx.fillRect(x+7,e.y+9,7,8);
ctx.fillRect(x+e.w-14,e.y+9,7,8);
ctx.fillStyle="#222";
ctx.fillRect(x+10,e.y+25,e.w-20,4);
if(e.boss){
ctx.fillStyle="#222";ctx.fillRect(x,e.y-14,e.w,8);
ctx.fillStyle="#42ee59";ctx.fillRect(x,e.y-14,e.w*(e.hp/5),8);
}
}

// Münzen
for(let o of coins){
if(o.taken)continue;
let x=o.x-camera;
ctx.fillStyle="#ffdc20";
ctx.beginPath();ctx.arc(x,o.y,9,0,7);ctx.fill();
ctx.strokeStyle="#c88800";ctx.stroke();
}

// Checkpoints
for(let cp of checkpoints){
let x=cp-camera;
if(x<0||x>W)continue;
ctx.fillStyle="#333";ctx.fillRect(x,330,5,60);
ctx.fillStyle=cp<=checkpoint?"#35ed79":"#ffdf35";
ctx.fillRect(x+5,330,25,17);
}

// Ziel
let gx=goal-camera;
ctx.fillStyle="#333";ctx.fillRect(gx,310,8,80);
ctx.fillStyle="#ffdc28";ctx.fillRect(gx+8,310,45,25);

// Würfel
ctx.fillStyle="#2479ed";
ctx.fillRect(player.x-camera,player.y,30,30);
ctx.fillStyle="white";
ctx.fillRect(player.x-camera+6,player.y+7,6,7);
ctx.fillRect(player.x-camera+19,player.y+7,6,7);
ctx.fillStyle="#14213d";
ctx.fillRect(player.x-camera+9,player.y+20,13,3);

if(won){
ctx.fillStyle="#000b";ctx.fillRect(0,0,W,H);
ctx.fillStyle="white";ctx.textAlign="center";
ctx.font="bold 42px Arial";
ctx.fillText("🏆 DU HAST GEWONNEN!",450,190);
ctx.font="25px Arial";
ctx.fillText("Alle 5 Welten geschafft!",450,245);
ctx.fillText("Münzen: "+score,450,290);
}
}

function loop(time){
let dt=lastTime?Math.min((time-lastTime)/16.67,2):1;
lastTime=time;
update(dt);
draw();
requestAnimationFrame(loop);
}

restart();
requestAnimationFrame(loop);
</script>
</body>
</html>
