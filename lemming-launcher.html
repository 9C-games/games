<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lemming Launcher</title><style>
:root{--bg:#10151f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151f}}
:root[data-theme=dark]{--bg:#10151f}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.pill{background:#0009;border-radius:20px;padding:4px 10px;font-weight:700;font-size:14px;white-space:nowrap}
#hud{z-index:3;position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:space-between;padding:8px;gap:6px;pointer-events:none}
#mid{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.btn{pointer-events:auto;border:0;border-radius:20px;background:#ffb300;color:#222;font-weight:800;font-size:18px;padding:12px 28px;cursor:pointer;box-shadow:0 4px 0 #b37d00}
#cart{pointer-events:auto;font-size:20px;padding:4px 10px;cursor:pointer;border:0;color:#fff}
#birds{position:fixed;right:6px;top:40%;display:flex;flex-direction:column;gap:6px}
#birds svg{width:34px;height:34px}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000a;text-align:center;padding:16px}
.ov.on{display:flex}
#over{background:transparent;justify-content:flex-start;padding-top:12vh}#ot{background:#000b;padding:10px 20px;border-radius:16px}
#shop{display:flex;transform:translateY(100%);transition:transform .35s;background:#1b1f2e;justify-content:flex-start;padding-top:60px;overflow:auto;z-index:5}
#shop.on{transform:none}
#x{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));font-size:22px;background:#0009;border:0;color:#fff;border-radius:50%;width:40px;height:40px;cursor:pointer}
#cards,#skins{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.card{position:relative;width:130px;padding:12px 8px;border-radius:16px;background:linear-gradient(#3a3320,#2a2616);border:2px solid #ffd54a;cursor:pointer;font-weight:700}
.card svg{width:70px;height:70px}
.card.lock{filter:grayscale(1);opacity:.55;border-color:#888}
.card .lk{position:absolute;right:8px;top:6px;font-size:20px}
.card.sh{animation:sh .35s}.card.pop{animation:pop .5s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{50%{transform:scale(1.15);box-shadow:0 0 30px #ffd54a}}
.card.sel{box-shadow:0 0 14px #4f4;border-color:#4f4}input{user-select:text;-webkit-user-select:text}#shop{touch-action:pan-y}
h1,h2{margin:0}
</style></head><body><canvas id="c"></canvas>
<div id="hud"><button id="cart" class="pill">🛒</button><div id="mid"><div class="pill">🪙 <span id="co">0</span></div><div class="pill" id="uh">↑ 0 m</div><div class="pill" id="rd">→ 0 m</div></div><div class="pill" id="bs">BEST: 0 m</div></div>
<div id="birds"></div>
<div class="ov on" id="menu"><h1>🐹 Lemming Launcher</h1><div>Winkel wählen, halten für Power, loslassen zum Abschuss.<br>Im Flug tippen = goldener Vogel</div><button class="btn" id="go">START</button></div>
<div class="ov" id="over"><h2>GAME OVER</h2><div id="ot" style="font-size:18px;line-height:1.6"></div><button class="btn" id="again">NOCHMAL</button></div>
<div class="ov" id="shop"><button id="x">✕</button><div class="pill" style="font-size:18px">🪙 <span id="co2">0</span></div><h2>Goldene Vögel</h2><div id="cards"></div><h2>Skins</h2><div id="skins"></div><div style="margin:16px 0 30px;display:flex;gap:8px;justify-content:center"><input id="cd" placeholder="Code eingeben" inputmode="numeric" style="font-size:16px;padding:8px 12px;border-radius:12px;border:2px solid #ffd54a;background:#2a2616;color:#fff;width:150px"><button class="btn" id="cdb" style="font-size:14px;padding:8px 16px">Einlösen</button></div><div id="cm" style="margin-bottom:30px;font-weight:700"></div></div>
<script>
let camY=0;const $=i=>document.getElementById(i),cv=$('c'),X=cv.getContext('2d');
let D={coins:0,best:0,b:[0,0,0],skin:0,rc:0};try{Object.assign(D,JSON.parse(localStorage.getItem('lm')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('lm',JSON.stringify(D))}catch(e){}},fmt=n=>Math.floor(n).toLocaleString('de-DE');
const G=28,HB=8,SEG=800,V100=Math.sqrt(2*G*100);
const BM=[{t:'#3d9bf0',b:'#d4f0ff',g:'#58c04a'},{t:'#16794f',b:'#9fe3a0',g:'#1f7a34'},{t:'#7ea6cf',b:'#f1f7ff',g:'#f2f7ff'}];
let seq=[0];
function bi(i){i=Math.max(0,i);while(seq.length<=i){let l=seq[seq.length-1],n;do n=Math.floor(Math.random()*3);while(n==l);seq.push(n)}return seq[i]}
function mix(a,b,f){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),A=p(a),B=p(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*f))+')'}
function bc(m,k){const i=Math.floor(m/SEG);if(i<1)return BM[0][k];return mix(BM[bi(i-1)][k],BM[bi(i)][k],Math.min(1,(m-i*SEG)/150))}
const hs=k=>{let v=Math.sin((k+sd)*127.1)*43758.5;return v-Math.floor(v)};
let sd=0,W,H,r,st='menu',vh=110,cx=-30,tm=0,lt=0,ra=Math.random;
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;X.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
function birdSVG(i){const c=['#ffd54a','#ffb300','#ffe27a'][i],d=['#e0a800','#c77700','#d9a400'][i];
return`<svg viewBox="0 0 64 64"><ellipse cx="30" cy="38" rx="20" ry="15" fill="${c}" stroke="${d}" stroke-width="3"/><circle cx="46" cy="26" r="11" fill="${c}" stroke="${d}" stroke-width="3"/><path d="M55 25l9 3-9 4z" fill="#ff8f00"/><circle cx="48" cy="24" r="2.5" fill="#222"/><path d="M14 36q12-16 24 2q-12 6-24-2z" fill="${d}"/>${i>0?'<path d="M40 16l2-10 4 8 4-8 2 10z" fill="#ff5252"/>':''}${i>1?'<path d="M12 40L0 52l16-4zM14 44L4 60l16-8z" fill="'+d+'"/>':''}</svg>`}
function newRun(){seq=[0];sd=ra()*1000;r={x:0,y:12,vx:0,vy:0,mx:0,mh:0,ap:0,item:null,birds:D.b.filter(Boolean).length,t:0,bs:[],cr:[],tr:[],gb:60+ra()*80,gc:100+ra()*300,gt:500+ra()*1500,bd:[],pt:[],tz:0,done:false,msg:'',mt:0,an:90,ad:-1,pw:0,pd:1,hold:false,ang:45,pow:1};
 gen(600);st='aim';$('over').classList.remove('on');$('menu').classList.remove('on');vh=110;cx=-30;hud()}
function put(x,lo,hi){for(let y=lo;y<hi;y+=(y<400?24:60))if(ra()<.204*(1+.3*Math.min(1,y/300))*(y<400?1:.5)){const c=ra()<.176,s=c?12:8,o={x:x+ra()*8,y:y+ra()*(y<400?24:60),s};if(!r.bs.concat(r.cr).some(p=>Math.abs(p.x-o.x)<5*Math.max(s,p.s)&&Math.abs(p.y-o.y)<3*Math.max(s,p.s))){if(c)r.cr.push(o);else{const q=ra()*2.625;o.k=q<1?0:q<2?1:q<2.5?2:3;r.bs.push(o)}}}}
function genUp(){if(r.y+1500>r.gtop){const lo=r.gtop,hi=r.y+3000;for(let x=r.x-50;x<r.gb;x+=24+ra()*16)put(x,lo,hi);r.gtop=hi}}
function gen(u){if(!r.gtop)r.gtop=3000;if(r.bs.length>3000){r.bs=r.bs.filter(b=>b.x>r.x-300);r.cr=r.cr.filter(c=>c.x>r.x-300)}while(r.gb<u){r.gb+=24+ra()*16;put(r.gb,12,r.gtop)}
 while(r.gt<u){r.tr.push(r.gt);r.gt+=500+ra()*1500}}
function hud(){const b=Math.max(D.best,r?r.mx:0);$('co').textContent=$('co2').textContent=fmt(D.coins);$('uh').textContent='↑ '+fmt(r&&st!='menu'?r.y:0)+' m';$('rd').textContent='→ '+fmt(r?r.mx:0)+' m';
 const e=$('bs');e.textContent='BEST: '+fmt(b)+' m';e.style.fontSize=Math.max(9,14-Math.max(0,e.textContent.length-12)*.6)+'px';
 const bd=$('birds'),n=st=='menu'||st=='over'?0:r.birds;if(bd.childElementCount!=n)bd.innerHTML=birdSVG(0).repeat(n);
 $('cart').style.display=st=='menu'||st=='over'?'':'none'}
function launch(){const a=r.ang*Math.PI/180,v=40+95*r.pow;r.vx=v*Math.cos(a);r.vy=v*Math.sin(a);r.x=0;r.y=12;if(D.skin){const c=Math.cos(a),s=Math.sin(a);r.x=-5+14*c;r.y=6+14*s;for(let i=0;i<16;i++)r.pt.push({x:r.x,y:r.y,vx:c*(8+ra()*28)+(ra()-.5)*10,vy:s*(8+ra()*28)+(ra()-.5)*10+3,l:1.2,s:6+ra()*8,c:i%2?'#aaa':'#ddd'});for(let i=0;i<10;i++)r.pt.push({x:r.x,y:r.y,vx:c*(10+ra()*30)+(ra()-.5)*25,vy:s*(10+ra()*30)+(ra()-.5)*25,l:.3,s:3+ra()*4,c:i%2?'#ffb02a':'#ff5a1a'})}r.ap=r.y;st='fly'}
function useBird(){if(st!='fly'||r.birds<1)return;r.birds--;r.bd.push({t:0,x:r.x+45,y:r.y+25});hud()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(st=='aim'){r.hold=true;r.ang=r.an;r.pw=0;r.pd=1}else useBird()});
const rel=()=>{if(st=='aim'&&r.hold){r.hold=false;r.pow=r.pw;st='intro';r.t=0}};addEventListener('pointerup',rel);addEventListener('pointercancel',rel);
function boom(x,y,c,n=10){for(let i=0;i<n;i++)r.pt.push({x,y,vx:(ra()-.5)*30,vy:(ra()-.5)*30,l:.6,c})}
function step(dt){
 if(st=='aim'){if(!r.hold){r.an+=r.ad*80*dt;if(r.an<=0){r.an=0;r.ad=1}if(r.an>=90){r.an=90;r.ad=-1}}else{r.pw+=r.pd*dt/1.1;if(r.pw>=1){r.pw=1;r.pd=-1}if(r.pw<=0){r.pw=0;r.pd=1}}return}
 if(st=='intro'){r.t+=dt;if(r.t>=(D.skin?.25:1.45))launch();return}
 if(st=='loot'){lt+=dt;if(lt>=2){const u=ra();r.item=null;
   if(u<.5){r.item={k:'spring',t:20,n:3};r.msg='Sprungfeder!'}else{r.item={k:'plane',t:7};r.vy=V100;r.msg='Papierflieger! +100 m'}
   r.mt=1.5;st='fly'}return}
 if(st!='fly')return;
 const it=r.item,gs=it&&it.k=='plane'&&r.vy<0?.25:1;
 r.vy-=G*gs*dt;if(it&&it.k=='fly')r.vy=-3;if(it&&it.k=='plane'&&r.vy<-6)r.vy=-6;
 r.x+=r.vx*dt;r.y+=r.vy*dt;r.mx=Math.max(r.mx,r.x);r.mh=Math.max(r.mh,r.y);r.ap=Math.max(r.ap,r.y);
 if(it){it.t-=dt;if(it.t<=0)r.item=null}
 r.mt-=dt;r.tz-=dt;gen(r.x+700);genUp();if(r.lo){r.lo.t+=dt;if(r.lo.t>=1.5){r.lo=null;lootRoll()}}
 for(const b of r.bs)if(!b.u&&Math.abs(b.x-r.x)<5&&Math.abs(b.y-r.y)<5){b.u=1;if(b.k==0){r.vx+=128;r.vy+=32}else if(b.k==1)r.vy=Math.max(r.vy,0)+112;else if(b.k==2)r.inf=true;else r.item={k:'fly',t:20};boom(b.x,b.y,'#ff7a1a')}
 for(let i=0;i<r.cr.length;i++){const c=r.cr[i];if(Math.abs(c.x-r.x)<5.5&&Math.abs(c.y-r.y)<6){r.cr.splice(i,1);r.lo={t:0};break}}
 for(const b of r.bd){b.t+=dt;if(!b.d&&b.t>=.35){b.d=1;r.vy=V100*1.35;r.vx+=15;boom(r.x,r.y,'#ffd54a',14)}}
 r.bd=r.bd.filter(b=>b.t<.7);r.pt.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});r.pt=r.pt.filter(p=>p.l>0);
 if(r.y<=0){r.y=0;const t=r.tr.find(t=>Math.abs(t-r.x)<7);
  if(t!==undefined){r.vx*=.5;r.vy=Math.max(Math.abs(r.vy)*.5,22);r.ap=0;r.tz=.4;boom(r.x,0,'#ff5a7a')}
  else if(r.inf){r.inf=false;r.vy=2*Math.sqrt(2*G*Math.max(r.ap,1));r.ap=0;boom(r.x,0,'#9cf')}
  else if(it&&it.k=='spring'&&r.item){r.vy=Math.sqrt(2*G*.9*Math.max(r.ap,1));r.ap=0;it.n--;boom(r.x,0,'#bbb');if(it.n<=0)r.item=null}
  else end()}}
function lootRoll(){const u=ra();r.item=null;if(u<.5){r.item={k:'spring',t:20,n:3};r.msg='Sprungfeder!'}else{r.item={k:'plane',t:7};r.vy=V100;r.msg='Papierflieger! +100 m'}r.mt=1.5}
function end(){if(r.done)return;r.done=true;r.vx=0;r.vy=0;const c=Math.floor(r.mx/100),nb=r.mx>D.best;D.coins+=c;if(nb)D.best=Math.floor(r.mx);sv();st='over';
 $('ot').innerHTML='→ '+fmt(r.mx)+' m<br>↑ '+fmt(r.mh)+' m<br>🪙 +'+c+' Coins'+(nb?'<br>🏆 NEUE BESTLEISTUNG!':'');$('over').classList.add('on');hud()}
function lem(x,y,rot,u){X.save();X.translate(x,y);X.rotate(rot);let fg=X.createRadialGradient(-.3*u,-.4*u,.1*u,0,0,1.7*u);fg.addColorStop(0,'#d89a4a');fg.addColorStop(1,'#8a5018');X.fillStyle=fg;X.beginPath();X.ellipse(0,0,1.5*u,1.05*u,0,0,7);X.fill();X.fillStyle='#2b1a0e';X.beginPath();X.ellipse(-.4*u,-.5*u,.9*u,.45*u,.2,0,7);X.fill();X.fillStyle='#e8c88a';X.beginPath();X.ellipse(.1*u,.45*u,1.1*u,.5*u,0,0,7);X.fill();X.fillStyle='#8a5320';X.beginPath();X.arc(-1.5*u,.1*u,.3*u,0,7);X.ellipse(.6*u,1*u,.35*u,.2*u,0,0,7);X.ellipse(-.6*u,1*u,.35*u,.2*u,0,0,7);X.fill();
 let hg=X.createRadialGradient(1.1*u,-.5*u,.1*u,1.3*u,-.2*u,.95*u);hg.addColorStop(0,'#dba052');hg.addColorStop(1,'#8f561a');X.fillStyle=hg;X.beginPath();X.ellipse(1.3*u,-.2*u,.85*u,.75*u,0,0,7);X.fill();X.fillStyle='#e8c88a';X.beginPath();X.ellipse(1.85*u,.05*u,.45*u,.35*u,0,0,7);X.fill();X.fillStyle='#5a3510';X.beginPath();X.arc(1.05*u,-.95*u,.28*u,0,7);X.fill();X.fillStyle='#fff';X.fillRect(1.82*u,.25*u,.18*u,.3*u);X.fillRect(2*u,.25*u,.18*u,.3*u);X.fillStyle='#111';X.beginPath();X.arc(1.5*u,-.45*u,.17*u,0,7);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(1.55*u,-.5*u,.05*u,0,7);X.fill();X.fillStyle='#d77a86';X.beginPath();X.arc(2.2*u,-.05*u,.13*u,0,7);X.fill();X.strokeStyle='#ddd8';X.lineWidth=1;X.beginPath();for(let w=-1;w<2;w++){X.moveTo(2*u,.1*u);X.lineTo(2.7*u,.1*u+w*.25*u)}X.stroke();X.restore()}
function tree(px,gy,S,ty,k){const h=(10+hs(k)*8)*S;X.fillStyle=ty==2?'#6b4a2f':'#7a4f2a';
 if(ty==0){X.fillRect(px-.7*S,gy-h*.5,1.4*S,h*.5);for(let i=0;i<4;i++){X.fillStyle=['#2f8f2f','#3fae3a','#52c24a','#6bd45c'][i];X.beginPath();X.arc(px+(i%2?1:-1)*h*.1*(i>1?.5:1),gy-h*(.6+(i>1?.12:0)),h*(.38-i*.04),0,7);X.fill()}}
 else if(ty==1){X.fillRect(px-1.1*S,gy-h*1.1,2.2*S,h*1.1);X.fillStyle='#0f6b2a';X.beginPath();X.ellipse(px,gy-h*1.15,h*.6,h*.3,0,0,7);X.fill();X.fillStyle='#1c9a3c';X.beginPath();X.ellipse(px+h*.2,gy-h*1.3,h*.4,h*.22,0,0,7);X.fill()}
 else{X.fillRect(px-.5*S,gy-h*.2,S,h*.2);for(let i=0;i<3;i++){const w=h*(.5-i*.12),y=gy-h*.2-i*h*.28;X.fillStyle='#1f6b4a';X.beginPath();X.moveTo(px-w,y);X.lineTo(px+w,y);X.lineTo(px,y-h*.4);X.fill();X.fillStyle='#fff';X.beginPath();X.moveTo(px-w*.4,y-h*.24);X.lineTo(px+w*.4,y-h*.24);X.lineTo(px,y-h*.4);X.fill()}}}
function draw(dt){
 const F=st=='fly'||st=='loot'||st=='over',tv=110;vh+=(tv-vh)*Math.min(1,dt*3);
 camY+=((F?Math.max(0,r.y-45):0)-camY)*Math.min(1,dt*10);const S=H*.8/vh,gy=H*.86+camY*S,tcx=(F?r.x:0)-.3*W/S-(F?0:30);cx+=(tcx-cx)*Math.min(1,dt*6);
 const px=x=>(x-cx)*S,py=y=>gy-y*S,mid=cx+W/S/2;
 let g=X.createLinearGradient(0,0,0,gy);g.addColorStop(0,bc(mid,'t'));g.addColorStop(1,bc(mid,'b'));X.fillStyle=g;X.fillRect(0,0,W,H);
 const bm=bi(Math.floor(Math.max(0,mid)/SEG));
 if(bm==0){const sx=W*.8,sy=H*.14,gr=X.createRadialGradient(sx,sy,0,sx,sy,H*.45);gr.addColorStop(0,'rgba(255,252,230,1)');gr.addColorStop(.05,'rgba(255,244,180,.95)');gr.addColorStop(.1,'rgba(255,224,130,.4)');gr.addColorStop(1,'rgba(255,220,120,0)');X.fillStyle=gr;X.fillRect(0,0,W,H)}
 for(let k=0;k<7;k++){const cxp=((k*173-cx*S*.2)%(W+300)+W+300)%(W+300)-150,cy=H*(.08+hs(k)*.28),w=50+hs(k+9)*50;for(let j=0;j<5;j++){const ox=(j-2)*w*.38,oy=-Math.sin(j*1.3)*w*.12,rr=w*(.38+hs(k+j)*.18),gr=X.createRadialGradient(cxp+ox,cy+oy,0,cxp+ox,cy+oy,rr);gr.addColorStop(0,'rgba(255,255,255,.85)');gr.addColorStop(1,'rgba(255,255,255,0)');X.fillStyle=gr;X.beginPath();X.arc(cxp+ox,cy+oy,rr,0,7);X.fill()}}
 if(bm==2){X.fillStyle='#fff';for(let k=0;k<40;k++)X.fillRect((hs(k)*W+tm*20*hs(k+3))%W,(hs(k+50)*H+tm*60)%H,2,2)}
 for(let L=0;L<2;L++){const par=.1+L*.15,col=mix(BM[bm].g,BM[bm].b,.55-L*.25),base=gy-3*S;X.fillStyle=col;X.beginPath();X.moveTo(0,gy);for(let xx=0;xx<=W;xx+=12){const wx=(xx+cx*S*par)/S,h=(L?10:26)+Math.sin(wx*.03+L*2)*(L?5:12)+Math.sin(wx*.011+L)*(L?4:14);X.lineTo(xx,base-h*S*.55)}X.lineTo(W,gy);X.fill()}
 X.fillStyle=bc(mid,'g');X.fillRect(0,gy-3*S,W,3*S);
 const k0=Math.floor(cx/20)-1;for(let k=k0;k<k0+W/S/20+3;k++){const x=k*20+hs(k)*14;if(x<-40)continue;tree(px(x),gy-3*S+2,S,bi(Math.floor(x/SEG)),k)}
