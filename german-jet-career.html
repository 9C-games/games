<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>German Jet Career – World Bosses</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#071426;color:#f8fafc;font-family:system-ui,sans-serif}
body{min-height:100dvh;display:flex;justify-content:center}
#gameapp{width:100%;max-width:390px;padding:6px;display:flex;flex-direction:column;gap:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.box{background:#142238;border-radius:8px;padding:5px 8px}
.small{font-size:10px;color:#a9bdd8}
.val{font-size:14px;font-weight:bold}
#countryrow{display:flex;justify-content:space-between;align-items:center}
canvas{display:block;width:100%;height:min(42dvh,300px);min-height:180px;max-height:300px;aspect-ratio:auto;margin:auto;background:#071426;border:1px solid #344b68;border-radius:10px;touch-action:none}
button{background:#253d5b;border:1px solid #496587;border-radius:8px;padding:7px 12px;font-weight:bold;color:white;touch-action:none}
.controls{display:flex;justify-content:center;gap:12px}
.ctrl{width:60px;height:40px;font-size:20px}
.meter{height:6px;background:#29384e;border-radius:9px;overflow:hidden;margin-top:4px}
.fill{height:100%;width:0;background:#56d4f0}
#bossbox{display:none}
#status{font-size:12px}
</style>
</head>
<body>
<div id="gameapp">
<div class="stats">
 <div class="box"><div class="small">DISTANZ</div><div class="val"><span id="jm">0</span> m</div></div>
 <div class="box"><div class="small">LEBEN</div><div class="val" id="jl">❤️❤️❤️</div></div>
 <div class="box"><div class="small">JET</div><div class="val" id="jj">Eurofighter</div></div>
</div>
<div class="box" id="countryrow"><div><div class="small">KAMPAGNE</div><div class="val" id="jc">🇫🇷 Frankreich</div></div><div class="small" id="js">LEVEL 1/3</div></div>
<div class="box" id="bossbox"><div style="display:flex;justify-content:space-between;font-size:12px"><b id="jbl">BOSS</b><span id="jhptext">100%</span></div><div class="meter"><div class="fill" id="jhp"></div></div></div>
<canvas id="jcanvas" width="360" height="540"></canvas>
<div style="display:flex;justify-content:space-between;align-items:center;gap:4px"><div id="jstatus">Bereit!</div><button id="jstart">▶ Start</button></div>
<div class="box"><div style="display:flex;justify-content:space-between;font-size:12px"><b>Jet-Karriere</b><span id="jnext">Tornado bei 500m</span></div><div class="meter"><div class="fill" id="jcareer"></div></div><div class="small" style="margin-top:4px" id="junlock">Freigeschaltet: Eurofighter</div></div>
<div class="controls"><button class="ctrl" id="jleft">◀</button><button class="ctrl" id="jright">▶</button></div>
<div class="small" style="text-align:center">Pfeiltasten oder Buttons · Automatisches Schießen</div>
</div>
<script>
(()=>{
const r=document.getElementById('gameapp');const $=id=>document.getElementById(id),c=$('jcanvas'),x=c.getContext('2d');
const nations=[{n:'Frankreich',f:'fr',e:'🇫🇷',boss:'Französischer Boss',hp:12,t:850},{n:'USA',f:'us',e:'🇺🇸',boss:'Amerikanischer Boss',hp:22,t:2050},{n:'Russland',f:'ru',e:'🇷🇺',boss:'Russischer Endboss',hp:34,t:3900}];
const jets=[{n:'Eurofighter',t:0},{n:'Tornado',t:500},{n:'Stealth-Jet',t:1500},{n:'Super-Jet',t:3000}];
let p={x:180,y:465},k={l:0,r:0},bs=[],es=[],ss=[],shots=[],m=0,lives=3,st=0,boss=null,fr=0,sp=0,fire=0,iv=0,run=0,end=0,win=0,trans=0,last=0,unlock=new Set([0]);
function flag(f,a,b,w,h){
 if(f==='fr'){x.fillStyle='#17439a';x.fillRect(a,b,w/3,h);x.fillStyle='white';x.fillRect(a+w/3,b,w/3,h);x.fillStyle='#ed2939';x.fillRect(a+2*w/3,b,w/3,h)}
 if(f==='ru'){x.fillStyle='white';x.fillRect(a,b,w,h/3);x.fillStyle='#2454a6';x.fillRect(a,b+h/3,w,h/3);x.fillStyle='#d52b1e';x.fillRect(a,b+2*h/3,w,h/3)}
 if(f==='us'){for(let i=0;i<7;i++){x.fillStyle=i%2?'white':'#c92736';x.fillRect(a,b+i*h/7,w,h/7)}x.fillStyle='#17417c';x.fillRect(a,b,w*.48,h*.54);x.fillStyle='white';for(let i=0;i<12;i++)x.fillRect(a+3+i%4*5,b+3+Math.floor(i/4)*5,1.5,1.5)}
 x.strokeStyle='#e2e8f0';x.strokeRect(a,b,w,h);
}
function jet(a,b){x.save();x.translate(a,b);x.fillStyle='#a9bfd8';x.beginPath();x.moveTo(0,-25);x.lineTo(8,-5);x.lineTo(27,10);x.lineTo(25,16);x.lineTo(6,11);x.lineTo(5,23);x.lineTo(13,28);x.lineTo(12,32);x.lineTo(0,27);x.lineTo(-12,32);x.lineTo(-13,28);x.lineTo(-5,23);x.lineTo(-6,11);x.lineTo(-25,16);x.lineTo(-27,10);x.lineTo(-8,-5);x.closePath();x.fill();x.fillStyle='#facc15';x.fillRect(-3,23,6,9);x.restore()}
function ui(){
 $('jm').textContent=Math.floor(m);$('jl').textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(3-Math.max(0,lives));
 let j=0;jets.forEach((v,i)=>{if(m>=v.t){j=i;unlock.add(i)}});
 $('jj').textContent=jets[j].n;$('junlock').textContent='Jets: '+[...unlock].map(i=>jets[i].n).join(' · ');
 let next=jets.find(v=>v.t>m);$('jnext').textContent=next?'Nächster: '+next.n+' ('+next.t+'m)':'Alle Jets frei!';$('jcareer').style.width=next?Math.min(100,m/next.t*100)+'%':'100%';
 $('jc').textContent=nations[Math.min(st,2)].e+' '+nations[Math.min(st,2)].n;$('js').textContent='LEVEL '+(st+1)+'/3';
 $('bossbox').style.display=boss?'block':'none';
 if(boss){$('jbl').textContent=nations[st].boss;$('jhptext').textContent=Math.ceil(boss.hp)+'/'+boss.max;$('jhp').style.width=Math.max(0,boss.hp/boss.max*100)+'%'}
}
function background(){x.fillStyle='#071426';x.fillRect(0,0,360,540);for(let i=0;i<45;i++){let a=(i*73+Math.sin(fr*.015+i)*8)%360,b=(i*97+fr*(.8+(i%3)*.4))%540;x.fillStyle='#b7c9e5';x.globalAlpha=.4;x.fillRect(a,b,2,2)}x.globalAlpha=1}
function hit(a,b,rr){return Math.hypot(a.x-b.x,a.y-b.y)<rr}
function damage(){if(iv>0)return;lives--;iv=85;ui();if(lives<=0){run=0;end=1;$('jstatus').textContent='💥 Jet zerstört!';$('jstart').textContent='↻ Nochmal'}}
function spawnBoss(){boss={x:180,y:105,d:1,hp:nations[st].hp,max:nations[st].hp,shot:0};$('jstatus').textContent='⚠ BOSS-KAMPF!'}
function bossWin(){boss=null;if(st===2){win=1;run=0;end=1;$('jstatus').textContent='🏆 Russland besiegt!';$('jstart').textContent='↻ Nochmal'}else{st++;trans=100;$('jstatus').textContent='Boss besiegt!';ui()}}
function reset(){p={x:180,y:465};bs=[];es=[];ss=[];shots=[];m=0;lives=3;st=0;boss=null;fr=0;sp=0;fire=0;iv=0;trans=0;end=0;win=0;unlock=new Set([0]);run=1;last=0;$('jstart').textContent='Ⅱ Pause';$('jstatus').textContent='Mission läuft';ui();requestAnimationFrame(loop)}
function draw(){
 background();ss.forEach(a=>{x.fillStyle='#fde68a';x.beginPath();x.arc(a.x,a.y,4,0,7);x.fill()});
 es.forEach(a=>flag(a.f,a.x-13,a.y-9,26,18));
 bs.forEach(a=>{x.fillStyle='#67e8f9';x.fillRect(a.x-2,a.y-8,4,13)});
 shots.forEach(a=>{x.fillStyle='#fb7185';x.beginPath();x.arc(a.x,a.y,5,0,7);x.fill()});
 if(boss){flag(nations[st].f,boss.x-45,boss.y-28,90,56);x.fillStyle='white';x.textAlign='center';x.font='bold 11px sans-serif';x.fillText('BOSS',boss.x,boss.y+43)}
 if(iv%12<7)jet(p.x,p.y);
 if(!run&&!end){x.fillStyle='#fff';x.textAlign='center';x.font='bold 23px sans-serif';x.fillText('JET CAREER',180,245)}
 if(end){x.fillStyle='rgba(0,0,0,.7)';x.fillRect(0,0,360,540);x.fillStyle=win?'#fde68a':'white';x.textAlign='center';x.font='bold 23px sans-serif';x.fillText(win?'KAMPAGNE GESCHAFFT!':'MISSION BEENDET',180,240);x.font='15px sans-serif';x.fillStyle='white';x.fillText('Distanz: '+Math.floor(m)+' m',180,278);x.fillText(win?'Du bist Champion!':'Versuche es erneut!',180,307)}
 if(trans>0){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,360,540);x.fillStyle='#fde68a';x.textAlign='center';x.font='bold 24px sans-serif';x.fillText('LEVEL '+(st+1)+' GESCHAFFT!',180,260);x.fillStyle='white';x.fillText(nations[st].e+' '+nations[st].n,180,294)}
}
function loop(t){
 if(!run)return;let dt=Math.min(2,(t-last)/16.67||1);last=t;fr+=dt;
 if(trans>0){trans-=dt;draw();ui();requestAnimationFrame(loop);return}
 if(!boss){m+=.85*dt;if(m>=nations[st].t)spawnBoss();sp-=dt;if(sp<=0&&!boss){es.push({x:22+Math.random()*316,y:-20,f:nations[st].f,s:2+st*.65+Math.random()*1.3});sp=Math.max(18,48-st*9)}}
 else{boss.x+=boss.d*(1.8+st*.5)*dt;if(boss.x>305)boss.d=-1;if(boss.x<55)boss.d=1;boss.shot-=dt;if(boss.shot<=0){shots.push({x:boss.x,y:boss.y+30,s:3.1+st*.65});boss.shot=Math.max(22,55-st*9)}}
 if(k.l)p.x-=4.8*dt;if(k.r)p.x+=4.8*dt;p.x=Math.max(23,Math.min(337,p.x));
 fire-=dt;if(fire<=0){bs.push({x:p.x,y:p.y-25});fire=10}
 bs.forEach(a=>a.y-=8*dt);bs=bs.filter(a=>a.y>-15);
 es.forEach(a=>a.y+=a.s*dt);es=es.filter(a=>a.y<560);
 shots.forEach(a=>a.y+=a.s*dt);shots=shots.filter(a=>a.y<550);
 if(fr%70<dt)ss.push({x:20+Math.random()*320,y:-5,s:2.5});ss.forEach(a=>a.y+=a.s*dt);ss=ss.filter(a=>a.y<550);
 es.forEach(a=>{if(hit(p,a,24)){a.y=600;damage()}});shots.forEach(a=>{if(hit(p,a,17)){a.y=600;damage()}});
 ss.forEach(a=>{if(hit(p,a,20)){a.y=600;m+=35}});
 if(boss){bs.forEach(a=>{if(Math.abs(a.x-boss.x)<47&&Math.abs(a.y-boss.y)<32){a.y=-30;boss.hp--}});if(boss.hp<=0)bossWin()}
 if(iv>0)iv-=dt;ui();draw();requestAnimationFrame(loop)
}
$('jstart').onclick=()=>{if(run){run=0;$('jstart').textContent='▶ Weiter';$('jstatus').textContent='Pause'}else if(end||(!run&&!fr&&!m&&!boss)){reset()}else{run=1;last=0;$('jstart').textContent='Ⅱ Pause';requestAnimationFrame(loop)}};
function hold(id,key){let b=$(id);b.onpointerdown=e=>{e.preventDefault();k[key]=1;b.setPointerCapture(e.pointerId)};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>k[key]=0))}
hold('jleft','l');hold('jright','r');
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')k.l=1;if(e.key==='ArrowRight'||e.key==='d')k.r=1});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')k.l=0;if(e.key==='ArrowRight'||e.key==='d')k.r=0});
ui();draw();
})();
</script>
</body>
</html>
